[project]
name = "backend"
version = "0.1.0"
description = ""

requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi (>=0.138.0,<0.139.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg[binary] (>=3.3.4,<4.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "bcrypt (>=5.0.0,<6.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "redis (>=8.0.1,<9.0.0)",
    "uvicorn (>=0.51.0,<0.52.0)",
    "ruff (>=0.16.0,<0.17.0)"
]

[tool.poetry]
packages = [{include = "backend", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
